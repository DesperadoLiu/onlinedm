<div id="bn3d-app">
  <style>
    #bn3d-app {
      --bg: #f7f7f4;
      --fg: #20262d;
      --muted: #66707b;
      --line: #d7d9dc;
      --accent: #2f6f8f;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
      color: var(--fg);
      background: var(--bg);
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px;
      box-sizing: border-box;
    }

    #bn3d-app * {
      box-sizing: border-box;
    }

    #bn3d-app h1 {
      margin: 0 0 8px;
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0;
    }

    #bn3d-app .sub {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    #bn3d-app .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }

    #bn3d-app label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      color: var(--fg);
    }

    #bn3d-app select,
    #bn3d-app input[type="range"],
    #bn3d-app button {
      font: inherit;
    }

    #bn3d-app select,
    #bn3d-app button {
      border: 1px solid #bcc2c8;
      background: #fff;
      color: var(--fg);
      border-radius: 6px;
      padding: 8px 10px;
    }

    #bn3d-app button {
      cursor: pointer;
    }

    #bn3d-app button:hover {
      border-color: #8d98a5;
    }

    #bn3d-app input[type="checkbox"] {
      width: 16px;
      height: 16px;
    }

    #bn3d-canvas-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      min-height: 420px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, #fbfbf8 0%, #f2f3f1 100%);
      overflow: hidden;
    }

    #bn3d-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    #bn3d-canvas:active {
      cursor: grabbing;
    }

    #bn3d-app .readout {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
    }

    #bn3d-app .readout span {
      white-space: nowrap;
    }

    @media (max-width: 640px) {
      #bn3d-app {
        padding: 12px;
      }

      #bn3d-canvas-wrap {
        aspect-ratio: 4 / 3;
        min-height: 360px;
      }

      #bn3d-app .controls {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>

  <h1>二維常態分配 3D 互動圖</h1>
  <p class="sub">滑鼠拖曳旋轉，滾輪縮放；三組 rho 使用相同 x/y/z 範圍、相同公式與相同高度比例。</p>

  <div class="controls">
    <label>
      相關係數 rho
      <select id="rhoSelect">
        <option value="0.7">+0.7 正相關</option>
        <option value="0">0 零相關</option>
        <option value="-0.7">-0.7 負相關</option>
      </select>
    </label>
    <label>
      透明曲面
      <input id="surfaceToggle" type="checkbox" checked>
    </label>
    <label>
      線框
      <input id="wireToggle" type="checkbox" checked>
    </label>
    <label>
      底部等高線
      <input id="contourToggle" type="checkbox" checked>
    </label>
    <label>
      縮放
      <input id="zoomRange" type="range" min="0.72" max="1.55" step="0.01" value="1.08">
    </label>
    <button id="resetView" type="button">重設視角</button>
  </div>

  <div id="bn3d-canvas-wrap">
    <canvas id="bn3d-canvas" aria-label="可旋轉的二維常態分配三維圖"></canvas>
  </div>

  <div class="readout">
    <span id="rhoReadout">rho = +0.7</span>
    <span>muX = muY = 0</span>
    <span>sigmaX = sigmaY = 1</span>
    <span>x/y: [-3, 3]</span>
    <span>z: [0, 0.23]</span>
    <span id="angleReadout"></span>
  </div>

  <script>
    (function () {
      const root = document.getElementById("bn3d-app");
      const canvas = root.querySelector("#bn3d-canvas");
      const ctx = canvas.getContext("2d");
      const rhoSelect = root.querySelector("#rhoSelect");
      const surfaceToggle = root.querySelector("#surfaceToggle");
      const wireToggle = root.querySelector("#wireToggle");
      const contourToggle = root.querySelector("#contourToggle");
      const zoomRange = root.querySelector("#zoomRange");
      const resetView = root.querySelector("#resetView");
      const rhoReadout = root.querySelector("#rhoReadout");
      const angleReadout = root.querySelector("#angleReadout");

      const xMin = -3, xMax = 3, yMin = -3, yMax = 3, zMax = 0.23;
      const gridN = 77;
      const wireStep = 5;
      const contourLevels = [0.025, 0.045, 0.065, 0.085, 0.105, 0.13, 0.155, 0.18, 0.205];
      const contourColors = ["#2b4d7a", "#286b88", "#37848d", "#52957b", "#7aa663", "#b5ac4c", "#e7ad4c", "#da7a4b", "#cd524a"];

      let rho = Number(rhoSelect.value);
      let yaw = -0.78;
      let pitch = 0.58;
      let zoom = Number(zoomRange.value);
      let isDragging = false;
      let lastX = 0;
      let lastY = 0;
      let points = [];
      let cells = [];
      let contours = [];
      let peakPoint = { x: 0, y: 0, z: 0 };

      function pdf(x, y, r) {
        const denom = 2 * Math.PI * Math.sqrt(1 - r * r);
        const exponent = -((x * x) - (2 * r * x * y) + (y * y)) / (2 * (1 - r * r));
        return Math.exp(exponent) / denom;
      }

      function buildData() {
        points = [];
        cells = [];
        peakPoint = { x: 0, y: 0, z: 0 };
        for (let i = 0; i < gridN; i++) {
          const row = [];
          const y = yMin + (yMax - yMin) * i / (gridN - 1);
          for (let j = 0; j < gridN; j++) {
            const x = xMin + (xMax - xMin) * j / (gridN - 1);
            const z = pdf(x, y, rho);
            const point = { x, y, z };
            if (z > peakPoint.z) peakPoint = point;
            row.push(point);
          }
          points.push(row);
        }
        for (let i = 0; i < gridN - 1; i += 2) {
          for (let j = 0; j < gridN - 1; j += 2) {
            cells.push([points[i][j], points[i][j + 2] || points[i][j + 1], points[i + 2]?.[j + 2] || points[i + 1][j + 1], points[i + 2]?.[j] || points[i + 1][j]]);
          }
        }
        contours = contourLevels.map((level, idx) => ({ level, color: contourColors[idx], segments: contourSegments(level) }));
      }

      function contourSegments(level) {
        const segments = [];
        for (let i = 0; i < gridN - 1; i++) {
          for (let j = 0; j < gridN - 1; j++) {
            const square = [points[i][j], points[i][j + 1], points[i + 1][j + 1], points[i + 1][j]];
            const hits = [];
            [[0, 1], [1, 2], [2, 3], [3, 0]].forEach(([a, b]) => {
              const p1 = square[a];
              const p2 = square[b];
              if ((p1.z - level) * (p2.z - level) < 0) {
                const t = (level - p1.z) / (p2.z - p1.z);
                hits.push({
                  x: p1.x + (p2.x - p1.x) * t,
                  y: p1.y + (p2.y - p1.y) * t,
                  z: 0
                });
              }
            });
            if (hits.length === 2) segments.push([hits[0], hits[1]]);
            if (hits.length === 4) {
              segments.push([hits[0], hits[1]]);
              segments.push([hits[2], hits[3]]);
            }
          }
        }
        return segments;
      }

      function resizeCanvas() {
        const rect = canvas.getBoundingClientRect();
        const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
        canvas.width = Math.round(rect.width * dpr);
        canvas.height = Math.round(rect.height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw();
      }

      function project(p) {
        const nx = p.x / 3;
        const ny = p.y / 3;
        const nz = p.z / zMax * 1.25;
        const cy = Math.cos(yaw), sy = Math.sin(yaw);
        const cp = Math.cos(pitch), sp = Math.sin(pitch);
        const rx = nx * cy - ny * sy;
        const ry = nx * sy + ny * cy;
        const rz = nz;
        const yy = ry * cp - rz * sp;
        const depth = ry * sp + rz * cp;
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;
        const scale = Math.min(w, h) * 0.36 * zoom;
        return {
          x: w / 2 + rx * scale,
          y: h * 0.62 + yy * scale,
          d: depth
        };
      }

      function zColor(z, alpha) {
        const t = Math.max(0, Math.min(1, z / zMax));
        const stops = [
          [0.00, [43, 77, 122]],
          [0.35, [55, 132, 141]],
          [0.62, [122, 166, 99]],
          [0.82, [231, 173, 76]],
          [1.00, [205, 82, 74]]
        ];
        for (let i = 0; i < stops.length - 1; i++) {
          const [a, ca] = stops[i];
          const [b, cb] = stops[i + 1];
          if (t >= a && t <= b) {
            const u = (t - a) / (b - a);
            const rgb = ca.map((v, k) => Math.round(v + (cb[k] - v) * u));
            return `rgba(${rgb[0]},${rgb[1]},${rgb[2]},${alpha})`;
          }
        }
        return `rgba(205,82,74,${alpha})`;
      }

      function lineProjected(a, b, color, width) {
        const pa = project(a);
        const pb = project(b);
        ctx.beginPath();
        ctx.moveTo(pa.x, pa.y);
        ctx.lineTo(pb.x, pb.y);
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.stroke();
      }

      function drawLabel(text, x, y, options = {}) {
        const font = options.font || "12px Arial, Microsoft JhengHei, sans-serif";
        const fill = options.fill || "rgba(32,38,45,.96)";
        const bg = options.bg || "rgba(247,247,244,.86)";
        const padX = options.padX ?? 5;
        const padY = options.padY ?? 3;
        ctx.save();
        ctx.font = font;
        const metrics = ctx.measureText(text);
        const width = metrics.width + padX * 2;
        const height = 16 + padY * 2;
        const left = Math.max(4, Math.min(canvas.clientWidth - width - 4, x));
        const top = Math.max(4, Math.min(canvas.clientHeight - height - 4, y - height));
        ctx.fillStyle = bg;
        ctx.fillRect(left, top, width, height);
        ctx.strokeStyle = "rgba(150,158,166,.55)";
        ctx.lineWidth = 1;
        ctx.strokeRect(left, top, width, height);
        ctx.fillStyle = fill;
        ctx.fillText(text, left + padX, top + height - padY - 3);
        ctx.restore();
      }

      function drawAxes() {
        const base = [
          { x: xMin, y: yMin, z: 0 },
          { x: xMax, y: yMin, z: 0 },
          { x: xMax, y: yMax, z: 0 },
          { x: xMin, y: yMax, z: 0 }
        ].map(project);
        ctx.beginPath();
        ctx.moveTo(base[0].x, base[0].y);
        for (let i = 1; i < base.length; i++) ctx.lineTo(base[i].x, base[i].y);
        ctx.closePath();
        ctx.strokeStyle = "rgba(80,87,95,.55)";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        lineProjected({ x: xMin, y: yMin, z: 0 }, { x: xMax, y: yMin, z: 0 }, "rgba(35,42,50,.85)", 2);
        lineProjected({ x: xMin, y: yMin, z: 0 }, { x: xMin, y: yMax, z: 0 }, "rgba(35,42,50,.85)", 2);
        lineProjected({ x: xMin, y: yMin, z: 0 }, { x: xMin, y: yMin, z: zMax }, "rgba(35,42,50,.85)", 2);

        ctx.fillStyle = "rgba(35,42,50,.9)";
        ctx.font = "14px Arial, Microsoft JhengHei, sans-serif";
        const xLabel = project({ x: xMax, y: yMin, z: 0 });
        const yLabel = project({ x: xMin, y: yMax, z: 0 });
        const zLabel = project({ x: xMin, y: yMin, z: zMax });
        ctx.fillText("X", xLabel.x + 8, xLabel.y);
        ctx.fillText("Y", yLabel.x + 8, yLabel.y);
        ctx.fillText("Density", zLabel.x + 8, zLabel.y - 8);

        ctx.font = "12px Arial, Microsoft JhengHei, sans-serif";
        ctx.fillStyle = "rgba(35,42,50,.84)";
        [-3, -2, -1, 0, 1, 2, 3].forEach(value => {
          const xt = project({ x: value, y: yMin, z: 0 });
          const yt = project({ x: xMin, y: value, z: 0 });
          ctx.fillText(String(value), xt.x - 6, xt.y + 18);
          ctx.fillText(String(value), yt.x - 24, yt.y + 4);
        });
        [0.00, 0.05, 0.10, 0.15, 0.20].forEach(value => {
          const zt = project({ x: xMin, y: yMin, z: value });
          lineProjected({ x: xMin, y: yMin, z: value }, { x: xMin + 0.12, y: yMin, z: value }, "rgba(35,42,50,.55)", 1);
          ctx.fillText(value.toFixed(2), zt.x + 10, zt.y + 4);
        });
      }

      function drawContours() {
        contours.forEach(({ color, segments }) => {
          ctx.strokeStyle = color;
          ctx.globalAlpha = 0.7;
          ctx.lineWidth = 1.4;
          segments.forEach(([a, b]) => {
            const pa = project(a);
            const pb = project(b);
            ctx.beginPath();
            ctx.moveTo(pa.x, pa.y);
            ctx.lineTo(pb.x, pb.y);
            ctx.stroke();
          });
        });
        ctx.globalAlpha = 1;
      }

      function drawContourLabels() {
        contours.forEach(({ level, color, segments }, idx) => {
          if (idx % 2 === 1 || segments.length === 0) return;
          const seg = segments[Math.floor(segments.length * 0.18)];
          const mid = {
            x: (seg[0].x + seg[1].x) / 2,
            y: (seg[0].y + seg[1].y) / 2,
            z: 0
          };
          const p = project(mid);
          drawLabel(level.toFixed(3), p.x + 4, p.y - 4, {
            fill: color,
            bg: "rgba(247,247,244,.82)",
            padX: 4,
            padY: 2
          });
        });
      }

      function drawSurface() {
        const sorted = cells.map(cell => {
          const projected = cell.map(project);
          const avgDepth = projected.reduce((sum, p) => sum + p.d, 0) / projected.length;
          const avgZ = cell.reduce((sum, p) => sum + p.z, 0) / cell.length;
          return { projected, avgDepth, avgZ };
        }).sort((a, b) => a.avgDepth - b.avgDepth);

        sorted.forEach(({ projected, avgZ }) => {
          ctx.beginPath();
          ctx.moveTo(projected[0].x, projected[0].y);
          for (let i = 1; i < projected.length; i++) ctx.lineTo(projected[i].x, projected[i].y);
          ctx.closePath();
          ctx.fillStyle = zColor(avgZ, 0.46);
          ctx.fill();
        });
      }

      function drawWireframe() {
        ctx.strokeStyle = "rgba(26,32,39,.72)";
        ctx.lineWidth = 1.15;
        for (let i = 0; i < gridN; i += wireStep) {
          ctx.beginPath();
          for (let j = 0; j < gridN; j++) {
            const p = project(points[i][j]);
            if (j === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
          }
          ctx.stroke();
        }
        for (let j = 0; j < gridN; j += wireStep) {
          ctx.beginPath();
          for (let i = 0; i < gridN; i++) {
            const p = project(points[i][j]);
            if (i === 0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
          }
          ctx.stroke();
        }
      }

      function drawPeakLabel() {
        const peak = project(peakPoint);
        ctx.beginPath();
        ctx.arc(peak.x, peak.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(190,55,50,.95)";
        ctx.fill();
        ctx.strokeStyle = "rgba(247,247,244,.96)";
        ctx.lineWidth = 1.5;
        ctx.stroke();
        drawLabel(`max f(0,0) = ${peakPoint.z.toFixed(3)}`, peak.x + 10, peak.y - 8, {
          font: "13px Arial, Microsoft JhengHei, sans-serif",
          fill: "rgba(150,34,32,.98)"
        });
      }

      function drawTitle() {
        const displayRho = rho > 0 ? "+0.7" : rho < 0 ? "-0.7" : "0";
        ctx.fillStyle = "rgba(32,38,45,.95)";
        ctx.font = "bold 18px Arial, Microsoft JhengHei, sans-serif";
        ctx.fillText(`rho = ${displayRho}`, 22, 34);
        ctx.font = "13px Arial, Microsoft JhengHei, sans-serif";
        ctx.fillStyle = "rgba(102,112,123,.95)";
        ctx.fillText("Bivariate normal PDF", 22, 56);
      }

      function draw() {
        const w = canvas.clientWidth;
        const h = canvas.clientHeight;
        ctx.clearRect(0, 0, w, h);
        drawAxes();
        if (contourToggle.checked) drawContours();
        if (surfaceToggle.checked) drawSurface();
        if (wireToggle.checked) drawWireframe();
        if (contourToggle.checked) drawContourLabels();
        drawPeakLabel();
        drawTitle();

        const displayRho = rho > 0 ? "+0.7" : rho < 0 ? "-0.7" : "0";
        rhoReadout.textContent = `rho = ${displayRho}`;
        angleReadout.textContent = `水平角 ${Math.round(yaw * 180 / Math.PI)} 度，仰角 ${Math.round(pitch * 180 / Math.PI)} 度`;
      }

      canvas.addEventListener("pointerdown", event => {
        isDragging = true;
        lastX = event.clientX;
        lastY = event.clientY;
        canvas.setPointerCapture(event.pointerId);
      });

      canvas.addEventListener("pointermove", event => {
        if (!isDragging) return;
        const dx = event.clientX - lastX;
        const dy = event.clientY - lastY;
        lastX = event.clientX;
        lastY = event.clientY;
        yaw += dx * 0.008;
        pitch += dy * 0.006;
        pitch = Math.max(-0.2, Math.min(1.35, pitch));
        draw();
      });

      canvas.addEventListener("pointerup", event => {
        isDragging = false;
        try {
          canvas.releasePointerCapture(event.pointerId);
        } catch (error) {
          // Pointer capture may already be released by the browser.
        }
      });

      canvas.addEventListener("wheel", event => {
        event.preventDefault();
        zoom = Math.max(0.72, Math.min(1.55, zoom - event.deltaY * 0.001));
        zoomRange.value = String(zoom);
        draw();
      }, { passive: false });

      rhoSelect.addEventListener("change", () => {
        rho = Number(rhoSelect.value);
        buildData();
        draw();
      });
      surfaceToggle.addEventListener("change", draw);
      wireToggle.addEventListener("change", draw);
      contourToggle.addEventListener("change", draw);
      zoomRange.addEventListener("input", () => {
        zoom = Number(zoomRange.value);
        draw();
      });
      resetView.addEventListener("click", () => {
        yaw = -0.78;
        pitch = 0.58;
        zoom = 1.08;
        zoomRange.value = String(zoom);
        draw();
      });

      window.addEventListener("resize", resizeCanvas);
      buildData();
      resizeCanvas();
      window.bn3dVideoControl = {
        setView(nextYaw, nextPitch, nextZoom, nextRho) {
          yaw = nextYaw;
          pitch = nextPitch;
          zoom = nextZoom;
          zoomRange.value = String(zoom);
          if (typeof nextRho === "number" && nextRho !== rho) {
            rho = nextRho;
            rhoSelect.value = String(rho);
            buildData();
          }
          draw();
        }
      };
    }());
  </script>
</div>
